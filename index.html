<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trifam Advent Calendar 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎄 Trifam Advent Calendar 🎄</h1>
  <p id="status"></p>
</header>
<main>
  <div id="pv">Preview day (0 = before Dec 1, 25 = after): <input id="pvd" type="number" min="0" max="25" value="1"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>An Advent Calendar For The Best People.</footer>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="panel">
    <div class="big" id="me"></div>
    <h2 id="mt"></h2>
    <p id="mm"></p>
    <button id="mc">Close</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
